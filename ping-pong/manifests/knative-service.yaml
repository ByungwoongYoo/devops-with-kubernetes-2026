apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pingpong
  namespace: exercises
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containers:
        - name: ping-pong
          image: dwk-ping-pong:2.7
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_HOST
              value: postgres-ping-pong-svc
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: pingpong
            - name: DATABASE_USER
              value: postgres
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ping-pong-postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 3000
