apiVersion: v1
kind: Secret
metadata:
  name: ping-pong-postgres-secret
  namespace: exercises
type: Opaque
stringData:
  POSTGRES_PASSWORD: course-local-ping-pong-password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ping-pong-svc
  namespace: exercises
  labels:
    app: postgres-ping-pong
spec:
  clusterIP: None
  selector:
    app: postgres-ping-pong
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ping-pong
  namespace: exercises
spec:
  serviceName: postgres-ping-pong-svc
  replicas: 1
  selector:
    matchLabels:
      app: postgres-ping-pong
  template:
    metadata:
      labels:
        app: postgres-ping-pong
    spec:
      containers:
        - name: postgres
          image: postgres:18.0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pingpong
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ping-pong-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "pingpong"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
