apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-generator
              image: dwk-todo-generator:2.9
              imagePullPolicy: IfNotPresent
              env:
                - name: TODO_BACKEND_URL
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: TODO_BACKEND_URL
                - name: WIKIPEDIA_RANDOM_URL
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: WIKIPEDIA_RANDOM_URL
                - name: MAX_TODO_LENGTH
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: MAX_TODO_LENGTH
