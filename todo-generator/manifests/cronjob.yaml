apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-generator
              image: PROJECT/TODO_GENERATOR
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              env:
                - name: TODO_BACKEND_URL
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: TODO_BACKEND_URL
                - name: WIKIPEDIA_RANDOM_URL
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: WIKIPEDIA_RANDOM_URL
                - name: MAX_TODO_LENGTH
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: MAX_TODO_LENGTH
