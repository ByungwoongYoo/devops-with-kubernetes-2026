name: build-5.8-landscape

on:
  push:
    branches: ["5.8"]
    paths-ignore:
      - 'docs/cncf-landscape-used.png'
      - 'docs/cncf-landscape-detection.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annotate-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5.8

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --quiet pillow

      - name: Download and render the CNCF landscape
        run: |
          mkdir -p docs /tmp/landscape-artifact
          curl --fail --insecure --location --retry 5 --retry-delay 2 \
            https://landscapeapp.cncf.io/cncf/images/landscape.pdf \
            -o /tmp/landscape.pdf
          head -c 5 /tmp/landscape.pdf | grep -q '%PDF-'
          pdftoppm -f 1 -singlefile -png -r 170 /tmp/landscape.pdf /tmp/landscape
          cp /tmp/landscape.png /tmp/landscape-artifact/landscape.png
          file /tmp/landscape.png

      - name: Upload official landscape source
        uses: actions/upload-artifact@v4
        with:
          name: cncflandscape-source
          path: /tmp/landscape-artifact/landscape.png
          if-no-files-found: error
          retention-days: 7

      - name: Placeholder until audited coordinates are committed
        run: |
          echo 'Official source image rendered and uploaded for coordinate audit.'
