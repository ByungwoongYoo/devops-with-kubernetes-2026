name: build-5.8-landscape

on:
  push:
    branches: ["5.8"]
    paths-ignore:
      - 'docs/cncf-landscape-used.png'
      - 'docs/cncf-landscape-detection.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annotate-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5.8

      - name: Install image/OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          python -m pip install --quiet pillow pytesseract

      - name: Download and render the CNCF landscape
        run: |
          mkdir -p docs
          curl --fail --location --retry 5 --retry-delay 2 \
            https://landscapeapp.cncf.io/cncf/images/landscape.pdf \
            -o /tmp/landscape.pdf
          file /tmp/landscape.pdf
          pdftoppm -f 1 -singlefile -png -r 170 /tmp/landscape.pdf /tmp/landscape
          file /tmp/landscape.png

      - name: Circle directly and indirectly used projects
        run: |
          cat > /tmp/annotate.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import pytesseract, re
          from pytesseract import Output

          source = '/tmp/landscape.png'
          out = 'docs/cncf-landscape-used.png'
          report_path = 'docs/cncf-landscape-detection.txt'
          img = Image.open(source).convert('RGB')
          data = pytesseract.image_to_data(img, output_type=Output.DICT, config='--psm 11')

          direct = {
              'Kubernetes': ['kubernetes'],
              'Docker': ['docker'],
              'Helm': ['helm'],
              'Prometheus': ['prometheus'],
              'Grafana': ['grafana'],
              'Argo CD': ['argo cd', 'argocd'],
              'Istio': ['istio'],
              'Knative': ['knative'],
              'NGINX': ['nginx'],
              'Traefik': ['traefik'],
              'GitHub Actions': ['github actions'],
              'Google Kubernetes Engine': ['google kubernetes engine', 'gke'],
          }
          indirect = {
              'K3s': ['k3s'],
              'Flannel': ['flannel'],
              'CoreDNS': ['coredns', 'core dns'],
              'containerd': ['containerd'],
          }

          def norm(s):
              return re.sub(r'[^a-z0-9]+', ' ', s.lower()).strip()

          lines = {}
          words = []
          for i, raw in enumerate(data['text']):
              text = raw.strip()
              if not text:
                  continue
              try:
                  conf = float(data['conf'][i])
              except Exception:
                  conf = -1
              if conf < 10:
                  continue
              x, y, w, h = [int(data[k][i]) for k in ('left','top','width','height')]
              key = (data['block_num'][i], data['par_num'][i], data['line_num'][i])
              lines.setdefault(key, []).append((text, x, y, w, h, conf))
              words.append((text, x, y, w, h, conf))

          candidates = []
          for items in lines.values():
              items = sorted(items, key=lambda z: z[1])
              text = ' '.join(z[0] for z in items)
              x0 = min(z[1] for z in items)
              y0 = min(z[2] for z in items)
              x1 = max(z[1] + z[3] for z in items)
              y1 = max(z[2] + z[4] for z in items)
              candidates.append((text, x0, y0, x1-x0, y1-y0, sum(z[5] for z in items)/len(items)))
          candidates += words

          def find_target(aliases):
              hits = []
              for rec in candidates:
                  text = norm(rec[0])
                  for alias in map(norm, aliases):
                      if text == alias or alias in text:
                          score = (1000 if text == alias else 0) + rec[5] - 0.001 * rec[3] * rec[4]
                          hits.append((score, rec))
              if not hits:
                  return None
              return max(hits, key=lambda z: z[0])[1]

          draw = ImageDraw.Draw(img)
          W, H = img.size
          green = (0, 150, 70)
          orange = (240, 130, 0)
          lw = max(5, W // 900)
          report, missing = [], []

          def mark(name, aliases, color, mode):
              rec = find_target(aliases)
              if rec is None:
                  missing.append(name)
                  report.append(f'MISSING\t{mode}\t{name}')
                  return
              text, x, y, w, h, conf = rec
              pad_x = max(22, int(w * 0.55))
              above = max(40, int(h * 4.0))
              below = max(12, int(h * 0.8))
              box = (
                  max(0, x-pad_x), max(0, y-above),
                  min(W, x+w+pad_x), min(H, y+h+below),
              )
              draw.ellipse(box, outline=color, width=lw)
              report.append(f'FOUND\t{mode}\t{name}\tocr={text!r}\tbox={box}\tconf={conf:.1f}')

          for name, aliases in direct.items():
              mark(name, aliases, green, 'DIRECT')
          for name, aliases in indirect.items():
              mark(name, aliases, orange, 'INDIRECT')

          legend_h = max(80, H // 40)
          canvas = Image.new('RGB', (W, H + legend_h), 'white')
          canvas.paste(img, (0, 0))
          d = ImageDraw.Draw(canvas)
          font = ImageFont.load_default()
          y = H + legend_h // 2
          r = max(9, W // 450)
          x = max(25, W // 120)
          d.ellipse((x-r, y-r, x+r, y+r), outline=green, width=max(3, lw//2))
          d.text((x+2*r, y-r), 'GREEN = directly used', fill='black', font=font)
          x2 = W // 2
          d.ellipse((x2-r, y-r, x2+r, y+r), outline=orange, width=max(3, lw//2))
          d.text((x2+2*r, y-r), 'ORANGE = indirectly used dependency', fill='black', font=font)
          canvas.save(out, optimize=True)

          with open(report_path, 'w', encoding='utf-8') as f:
              f.write('Source: https://landscapeapp.cncf.io/cncf/images/landscape.pdf\n')
              f.write(f'Rendered size: {W}x{H}\n')
              f.write('\n'.join(report) + '\n')
              if missing:
                  f.write('Missing OCR labels: ' + ', '.join(missing) + '\n')

          core = {'Kubernetes', 'Helm', 'Prometheus', 'Argo CD', 'Istio', 'Knative', 'containerd'}
          core_missing = core.intersection(missing)
          if core_missing:
              raise SystemExit('Core logos not located by OCR: ' + ', '.join(sorted(core_missing)))
          print('\n'.join(report))
          print('Missing non-core labels:', missing)
          PY
          python /tmp/annotate.py
          ls -lh docs/cncf-landscape-used.png docs/cncf-landscape-detection.txt

      - name: Commit submission image to branch 5.8
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cncf-landscape-used.png docs/cncf-landscape-detection.txt
          if git diff --cached --quiet; then
            echo 'No image changes to commit'
          else
            git commit -m 'Exercise 5.8: add annotated CNCF landscape image [skip ci]'
            git push origin HEAD:5.8
          fi
