name: Delete branch environment

on:
  delete:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: asia-northeast3-a

jobs:
  delete-environment:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    name: Delete branch namespace
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Delete namespace for deleted branch
        shell: bash
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          NS=$(echo "$DELETED_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)
          if [ -z "$NS" ] || [ "$NS" = "project" ]; then
            echo "Refusing to delete protected/invalid namespace: $NS"
            exit 1
          fi
          kubectl delete namespace "$NS" --ignore-not-found
