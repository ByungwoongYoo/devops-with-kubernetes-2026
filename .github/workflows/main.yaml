name: GitOps release project environments

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: asia-northeast3-docker.pkg.dev
  REPOSITORY: dwk

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Build and publish project images
        run: |
          TODO_APP_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_SHA"
          TODO_BACKEND_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA"
          TODO_GENERATOR_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-generator:$GITHUB_SHA"
          TODO_BROADCASTER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-broadcaster:$GITHUB_SHA"
          docker build -t "$TODO_APP_IMAGE" ./todo-app
          docker build -t "$TODO_BACKEND_IMAGE" ./todo-backend
          docker build -t "$TODO_GENERATOR_IMAGE" ./todo-generator
          docker build -t "$TODO_BROADCASTER_IMAGE" ./broadcaster
          docker push "$TODO_APP_IMAGE"
          docker push "$TODO_BACKEND_IMAGE"
          docker push "$TODO_GENERATOR_IMAGE"
          docker push "$TODO_BROADCASTER_IMAGE"
          echo "TODO_APP_IMAGE=$TODO_APP_IMAGE" >> "$GITHUB_ENV"
          echo "TODO_BACKEND_IMAGE=$TODO_BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "TODO_GENERATOR_IMAGE=$TODO_GENERATOR_IMAGE" >> "$GITHUB_ENV"
          echo "TODO_BROADCASTER_IMAGE=$TODO_BROADCASTER_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Select staging or production desired state
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "OVERLAY=overlays/staging" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=staging" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "OVERLAY=overlays/production" >> "$GITHUB_ENV"
            echo "RELEASE_KIND=production" >> "$GITHUB_ENV"
          else
            echo "Unexpected ref: $GITHUB_REF"
            exit 1
          fi

      - name: Update desired state on main
        run: |
          # Build from the triggering revision. Desired cluster state is kept
          # on main where ArgoCD watches the two environment overlays.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch origin main
            git checkout -B main origin/main
          fi

          cd "$OVERLAY"
          kustomize edit set image PROJECT/TODO_APP="$TODO_APP_IMAGE"
          kustomize edit set image PROJECT/TODO_BACKEND="$TODO_BACKEND_IMAGE"
          kustomize edit set image PROJECT/TODO_GENERATOR="$TODO_GENERATOR_IMAGE"
          kustomize edit set image PROJECT/TODO_BROADCASTER="$TODO_BROADCASTER_IMAGE"
          cd ../..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No desired-state change"
          else
            git commit -m "Release $RELEASE_KIND $GITHUB_SHA [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: GitOps boundary
        run: |
          echo "main commit -> staging overlay"
          echo "tagged commit -> production overlay"
          echo "CI never runs kubectl apply; ArgoCD pulls both environments."
