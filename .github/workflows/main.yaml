name: GitOps release log output

on:
  push:
    branches:
      - "4.7"
    paths:
      - "log-output/**"
      - ".github/workflows/main.yaml"

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: asia-northeast3-docker.pkg.dev
  REPOSITORY: dwk

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: "4.7"
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Build and publish log-output images
        run: |
          WRITER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/log-output-writer:$GITHUB_SHA"
          READER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/log-output-reader:$GITHUB_SHA"
          docker build -f log-output/Dockerfile.writer -t "$WRITER_IMAGE" ./log-output
          docker build -f log-output/Dockerfile.reader -t "$READER_IMAGE" ./log-output
          docker push "$WRITER_IMAGE"
          docker push "$READER_IMAGE"
          echo "WRITER_IMAGE=$WRITER_IMAGE" >> "$GITHUB_ENV"
          echo "READER_IMAGE=$READER_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update desired image state in Git
        run: |
          cd log-output
          kustomize edit set image PROJECT/LOG_WRITER="$WRITER_IMAGE"
          kustomize edit set image PROJECT/LOG_READER="$READER_IMAGE"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log-output/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No GitOps state change"
          else
            git commit -m "Release log-output $GITHUB_SHA [skip ci]"
            git fetch origin 4.7
            git rebase origin/4.7
            git push origin HEAD:4.7
          fi

      - name: GitOps boundary
        run: |
          echo "No kubectl deployment is performed here."
          echo "ArgoCD pulls the desired state from branch 4.7."
