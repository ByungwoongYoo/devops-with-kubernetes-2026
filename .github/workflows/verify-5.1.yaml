name: verify-5.1

on:
  push:
    branches: ["5.1"]
  workflow_dispatch:

jobs:
  verify-dummysite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Create test cluster
        run: |
          k3d cluster create verify51 --wait
          kubectl get nodes

      - name: Install DummySite CRD and controller
        run: |
          kubectl apply -f dummysite/manifests/crd.yaml
          kubectl wait --for=condition=Established crd/dummysites.stable.dwk --timeout=60s
          kubectl apply -f dummysite/manifests/controller.yaml
          kubectl rollout status deployment/dummysite-controller --timeout=180s

      - name: Create DummySite and verify generated resources
        run: |
          kubectl apply -f dummysite/manifests/example.yaml
          for i in $(seq 1 36); do
            if kubectl get deployment/dummysite-example-com >/dev/null 2>&1; then break; fi
            sleep 5
          done
          kubectl get dummysite example-com
          kubectl get configmap/dummysite-example-com-html
          kubectl get service/dummysite-example-com
          kubectl rollout status deployment/dummysite-example-com --timeout=180s
          kubectl logs deployment/dummysite-controller

      - name: Verify copied example.com content
        run: |
          kubectl port-forward service/dummysite-example-com 18080:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID || true' EXIT
          sleep 3
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:18080/ | tee /tmp/site.html
          grep -q "Example Domain" /tmp/site.html
