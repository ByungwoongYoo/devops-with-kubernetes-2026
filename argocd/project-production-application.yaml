apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ByungwoongYoo/devops-with-kubernetes-2026.git
    targetRevision: main
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: project-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
