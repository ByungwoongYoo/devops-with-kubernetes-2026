apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: dwk-todo-app:2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_FILE
              value: /usr/src/app/files/image.jpg
            - name: IMAGE_CACHE_TTL_MS
              value: "600000"
            - name: TODO_BACKEND_URL
              value: http://todo-backend-svc:2345
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
