apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: PROJECT/TODO_APP
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: TODO_APP_PORT
            - name: IMAGE_FILE
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: IMAGE_FILE
            - name: IMAGE_CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: IMAGE_CACHE_TTL_MS
            - name: TODO_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: TODO_BACKEND_URL
            - name: PICSUM_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: PICSUM_URL
            - name: MAX_TODO_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: MAX_TODO_LENGTH
            - name: REQUEST_BODY_LIMIT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: REQUEST_BODY_LIMIT_BYTES
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
