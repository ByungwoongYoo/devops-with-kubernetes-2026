apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-backup-ksa
  namespace: project
  annotations:
    iam.gke.io/gcp-service-account: todo-backup-sa@dwk-gke-508806.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
  namespace: project
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: todo-backup-ksa
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: PROJECT/TODO_BACKUP
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "256Mi"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: todo-backup-db
                      key: DATABASE_URL
                - name: BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: BACKUP_BUCKET
